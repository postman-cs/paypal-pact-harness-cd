openapi: 3.0.3
# The CONSUMER's own OAS — only the operation + fields the checkout service actually
# consumes from PayPal Orders. Both sides OAS-sourced: this (consumer) is cross-verified
# against the provider's full OAS. Renaming `status` on the provider breaks it.
info:
  title: checkout-consumer
  version: "1.0.0"
paths:
  /v2/checkout/orders/{id}:
    get:
      operationId: getOrder
      responses:
        "200":
          description: The fields this consumer reads
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  intent: { type: string }
                  purchase_units:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: object
                          properties:
                            value: { type: string }
