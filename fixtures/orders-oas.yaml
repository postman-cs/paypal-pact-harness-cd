openapi: 3.0.3
info:
  title: PayPal Orders API
  version: "2.0.0"
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: fields
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
components:
  schemas:
    Order:
      type: object
      properties:
        id: { type: integer }
        status: { type: string }
        total:
          type: object
          properties:
            amount: { type: string }
            currency: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              quantity: { type: integer }
