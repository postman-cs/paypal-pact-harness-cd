# The whole consumer-driven contract gate as ONE importable Harness CI pipeline — the
# same engine as the GitHub Actions twin, just a different runner. No broker, no server,
# no npm install: it calls the vendored bundle (tools/pact-harness) against committed
# fixtures + the seeded git ledger, so it runs GREEN with ZERO secrets. See harness/IMPORT.md.
pipeline:
  name: Contract gate (Harness · no box)
  identifier: contract_gate
  orgIdentifier: default
  projectIdentifier: default_project
  properties:
    ci:
      codebase:
        connectorRef: <+input>   # a git connector to THIS repo (paypal-pact-harness-cd)
        build: <+input>
  stages:
    - stage:
        name: Contract gate
        identifier: contract_gate
        type: CI
        spec:
          cloneCodebase: true
          platform: { os: Linux, arch: Amd64 }
          runtime: { type: Cloud, spec: {} }   # Harness Cloud; swap for KubernetesDirect on your cluster
          execution:
            steps:
              - step:
                  name: Immediate BDC gate (consumer pact × provider OAS)
                  identifier: bdc_gate
                  type: Run
                  spec:
                    image: node:20
                    shell: Sh
                    command: |
                      mkdir -p .out
                      node tools/pact-harness/pact-harness.mjs can-i-deploy \
                        --oas fixtures/orders-oas.json --pact fixtures/orders-consumer.pact.json \
                        --junit .out/bdc-gate.xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - .out/bdc-gate.xml
              - step:
                  name: Fleet can-i-deploy over the committed ledger (v2 live -> YES)
                  identifier: fleet_can_i_deploy
                  type: Run
                  spec:
                    image: node:20
                    shell: Sh
                    command: |
                      node tools/pact-harness/pact-harness.mjs can-i-deploy \
                        --ledger contracts --pacticipant paypal-orders --version v2-2026-07-01 --to production
              - step:
                  name: Fail-closed proof (a drift release is blocked)
                  identifier: fail_closed_proof
                  type: Run
                  spec:
                    image: node:20
                    shell: Sh
                    command: |
                      node tools/pact-harness/pact-harness.mjs record-verification \
                        --ledger contracts --oas fixtures/orders-oas.drift.json \
                        --pact fixtures/orders-consumer.pact.json \
                        --consumer-version 1.0.0 --provider-version v3-rename-status
                      if node tools/pact-harness/pact-harness.mjs can-i-deploy \
                           --ledger contracts --pacticipant paypal-orders --version v3-rename-status --to production; then
                        echo "drift release was NOT blocked"; exit 1
                      else
                        echo "drift release correctly blocked (fail-closed)"
                      fi
