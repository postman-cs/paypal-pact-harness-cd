# PAYPAL TPE DROP-IN
#
# Import this stage immediately before an existing promotion stage. Contract
# paths, subset, policy, exceptions, and report settings live in one reviewed
# repository profile. Harness supplies only its connectors, lower runtime URLs,
# and secrets.
stage:
  name: Contract - Consumer and route gate
  identifier: consumer_contract_gate
  type: CI
  variables:
    - name: config_path
      type: String
      required: true
      value: <+input>.default(paypal-contract-gate.config.json)
    - name: app_base_url
      type: String
      required: true
      value: <+input>.default(http://orders-spring.paypal-contract-lower.svc.cluster.local:8080)
    - name: actuator_url
      type: String
      required: true
      value: <+input>.default(http://orders-spring.paypal-contract-lower.svc.cluster.local:8080/actuator/mappings)
    - name: generated_openapi_url
      type: String
      required: true
      value: <+input>.default(http://orders-spring.paypal-contract-lower.svc.cluster.local:8080/v3/api-docs)
    - name: postman_collection_id
      type: String
      value: <+input>.default("")
  spec:
    cloneCodebase: true
    platform:
      os: Linux
      arch: Amd64
    execution:
      steps:
        - step:
            type: Run
            name: Verify the lower service from the repository profile
            identifier: verify_lower_contract_profile
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim
              shell: Sh
              envVariables:
                CONFIG_PATH: <+stage.variables.config_path>
                PAYPAL_CONTRACT_ACTUATOR_URL: <+stage.variables.actuator_url>
                PAYPAL_CONTRACT_OPENAPI_URL: <+stage.variables.generated_openapi_url>
                INVENTORY_BEARER_TOKEN: <+secrets.getValue("paypal_contract_demo_token")>
              command: |
                set -eu
                node paypal-contract-gate.mjs verify \
                  --config "$CONFIG_PATH" \
                  --clean
              reports:
                type: JUnit
                spec:
                  paths:
                    - .contract-reports/contract-gate-summary.xml
                    - .contract-reports/oas-audit.xml
                    - .contract-reports/oas-diff.xml
                    - .contract-reports/consumer-bdc.xml
                    - .contract-reports/route-contract.xml
                    - .contract-reports/generated-openapi-route-contract.xml
        - step:
            type: Run
            name: Postman CLI lower-environment cases
            identifier: postman_cli_lower_cases
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim
              shell: Sh
              envVariables:
                APP_BASE_URL: <+stage.variables.app_base_url>
                POSTMAN_COLLECTION_ID: <+stage.variables.postman_collection_id>
                POSTMAN_API_KEY: <+secrets.getValue("paypal_postman_api_key")>
                CONTRACT_DEMO_TOKEN: <+secrets.getValue("paypal_contract_demo_token")>
              command: |
                set -eu
                npm install --global postman-cli@1.44.0
                COLLECTION="$POSTMAN_COLLECTION_ID"
                [ -n "$COLLECTION" ] ||
                  COLLECTION=fixtures/paypal/orders-lower.postman_collection.json
                set -- \
                  --collection "$COLLECTION" \
                  --base-url "$APP_BASE_URL" \
                  --out-dir .contract-reports/postman
                [ -z "$POSTMAN_COLLECTION_ID" ] || set -- "$@" --cloud
                node tools/pact-harness/scripts/postman/run-lower-collection.mjs "$@"
              reports:
                type: JUnit
                spec:
                  paths:
                    - .contract-reports/postman/postman-run.xml
        - step:
            type: Run
            name: Seal all JSON and JUnit evidence
            identifier: seal_all_evidence
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim
              shell: Sh
              command: |
                set -eu
                node --input-type=module <<'NODE'
                import { createHash } from 'node:crypto';
                import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
                const files = readdirSync('.contract-reports', { recursive: true })
                  .map(String)
                  .filter((file) =>
                    file !== 'evidence-manifest.json' &&
                    (file.endsWith('.json') || file.endsWith('.xml') || file.endsWith('.txt')))
                  .sort();
                const evidence = files.map((file) => {
                  const content = readFileSync(`.contract-reports/${file}`);
                  return {
                    file,
                    bytes: content.length,
                    sha256: createHash('sha256').update(content).digest('hex'),
                  };
                });
                writeFileSync(
                  '.contract-reports/evidence-manifest.json',
                  `${JSON.stringify({ schemaVersion: 1, files: evidence }, null, 2)}\n`,
                );
                console.log(JSON.stringify({ evidenceManifest: evidence }, null, 2));
                NODE
    infrastructure:
      type: KubernetesDirect
      spec:
        connectorRef: <+input>
        namespace: <+input>.default(paypal-contract-lower)
        automountServiceAccountToken: false
        nodeSelector: {}
        os: Linux
