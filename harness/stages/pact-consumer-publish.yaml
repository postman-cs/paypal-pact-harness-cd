# CONSUMER PIPELINE STAGE
# Run after executable consumer Pact tests have written standards-compliant pact
# files. Do not generate the production pact from provider OAS or provider tests.
stage:
  name: Pact - Publish consumer contracts
  identifier: pact_publish_consumer_contracts
  type: CI
  variables:
    - name: harness_source_connector
      type: String
      required: true
      value: <+input>
    - name: harness_source_ref
      type: String
      required: true
      value: <+input>.default(main)
    - name: harness_source_commit
      type: String
      required: true
      value: <+input>
    - name: broker_base_url
      type: String
      required: true
      value: <+input>
    - name: pacts_path
      type: String
      required: true
      value: <+input>.default(pacts)
    - name: consumer_app_version
      type: String
      required: true
      value: <+input>.default(<+codebase.commitSha>)
    - name: consumer_branch
      type: String
      required: true
      value: <+input>.default(<+codebase.branch>)
  spec:
    cloneCodebase: true
    platform:
      os: Linux
      arch: Amd64
    execution:
      steps:
        - step:
            type: GitClone
            name: Pull the Postman-CS Pact Harness
            identifier: pull_postman_cs_pact_harness
            spec:
              connectorRef: <+stage.variables.harness_source_connector>
              repoName: postman-cs/paypal-pact-harness-cd
              build:
                type: branch
                spec:
                  branch: <+stage.variables.harness_source_ref>
              cloneDirectory: .pact-harness-source
              depth: 1
        - step:
            type: Run
            name: Attest the Postman-CS Pact Harness
            identifier: attest_postman_cs_pact_harness
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
              shell: Sh
              envVariables:
                EXPECTED_SOURCE_COMMIT: <+stage.variables.harness_source_commit>
              command: |
                set -eu
                node .pact-harness-source/scripts/ci/attest-harness-source.mjs \
                  --workspace .pact-harness-source \
                  --expected-commit "$EXPECTED_SOURCE_COMMIT" \
                  --output ../.contract-reports/source-attestation.json
              resources:
                limits:
                  memory: 500Mi
                  cpu: "0.25"
        - step:
            type: Run
            name: Publish validated pacts to the broker
            identifier: publish_validated_pacts
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
              shell: Sh
              envVariables:
                PACT_BROKER_BASE_URL: <+stage.variables.broker_base_url>
                PACT_BROKER_TOKEN: <+secrets.getValue("paypal_pact_broker_token")>
                PACT_DO_NOT_TRACK: "true"
                PACTS_PATH: <+stage.variables.pacts_path>
                CONSUMER_APP_VERSION: <+stage.variables.consumer_app_version>
                CONSUMER_BRANCH: <+stage.variables.consumer_branch>
              command: |
                set -eu
                REPORTS=.contract-reports/pact-consumer
                mkdir -p "$REPORTS"
                node .pact-harness-source/tools/pact-harness/scripts/install-pact-cli.mjs \
                  --lock .pact-harness-source/tools/pact-harness/pact-cli.lock.json \
                  --output .pact/bin/pact

                set +e
                .pact/bin/pact broker publish "$PACTS_PATH" \
                  --consumer-app-version "$CONSUMER_APP_VERSION" \
                  --branch "$CONSUMER_BRANCH" \
                  --validate \
                  --strict \
                  --output json \
                  > "$REPORTS/publish.json" \
                  2> "$REPORTS/publish.stderr.txt"
                status=$?
                set -e
                cat "$REPORTS/publish.stderr.txt" >&2
                cat "$REPORTS/publish.json"
                exit "$status"
              resources:
                limits:
                  memory: 500Mi
                  cpu: "0.5"
    infrastructure:
      type: KubernetesDirect
      spec:
        connectorRef: <+input>
        namespace: <+input>.default(paypal-contract-lower)
        automountServiceAccountToken: false
        nodeSelector: {}
        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: "1000"
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        os: Linux
