# PAYPAL TPE CUSTOMER-OWNED DROP-IN
#
# Import this stage into a PayPal application pipeline whose primary checkout is
# the application repository. Install the pinned portable bundle under
# .ci/pact-harness with scripts/vendor-pact-harness.mjs and commit the adjacent
# lock file. This stage verifies that full bundle before reading customer inputs.
stage:
  name: Contract - vendored consumer and route gate
  identifier: vendored_consumer_contract_gate
  type: CI
  variables:
    - name: bundle_path
      type: String
      required: true
      value: <+input>.default(.ci/pact-harness)
    - name: bundle_lock_path
      type: String
      required: true
      value: <+input>.default(.ci/pact-harness.lock.json)
    - name: bundle_verifier_path
      type: String
      required: true
      value: <+input>.default(.ci/verify-pact-harness.mjs)
    - name: config_path
      type: String
      required: true
      value: <+input>.default(paypal-contract-gate.config.json)
    - name: app_base_url
      type: String
      required: true
      value: <+input>
    - name: actuator_url
      type: String
      required: true
      value: <+input>
    - name: generated_openapi_url
      type: String
      required: true
      value: <+input>
    - name: postman_collection_path
      type: String
      value: <+input>.default("")
    - name: postman_collection_id
      type: String
      value: <+input>.default("")
  spec:
    cloneCodebase: true
    platform:
      os: Linux
      arch: Amd64
    execution:
      steps:
        - step:
            type: Run
            name: Verify the pinned vendored Pact Harness
            identifier: validate_vendored_bundle
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
              shell: Sh
              envVariables:
                BUNDLE_PATH: <+stage.variables.bundle_path>
                BUNDLE_LOCK_PATH: <+stage.variables.bundle_lock_path>
                BUNDLE_VERIFIER_PATH: <+stage.variables.bundle_verifier_path>
                CONFIG_PATH: <+stage.variables.config_path>
              command: |
                set -eu
                case "$BUNDLE_PATH:$BUNDLE_LOCK_PATH:$BUNDLE_VERIFIER_PATH:$CONFIG_PATH" in
                  /*|*":/"*|*".."*)
                    echo "bundle, lock, and config paths must remain inside the customer checkout" >&2
                    exit 2
                    ;;
                esac
                node "$BUNDLE_VERIFIER_PATH" \
                  --bundle "$BUNDLE_PATH" \
                  --lock "$BUNDLE_LOCK_PATH" \
                  --output .contract-inputs/vendored-bundle-attestation.json
                node "$BUNDLE_PATH/paypal-contract-gate.mjs" doctor --config "$CONFIG_PATH"
              resources:
                limits:
                  memory: 500Mi
                  cpu: "0.25"
        - step:
            type: Run
            name: Verify the lower service from the customer profile
            identifier: verify_lower_contract_profile
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
              shell: Sh
              envVariables:
                BUNDLE_PATH: <+stage.variables.bundle_path>
                CONFIG_PATH: <+stage.variables.config_path>
                PAYPAL_CONTRACT_ACTUATOR_URL: <+stage.variables.actuator_url>
                PAYPAL_CONTRACT_OPENAPI_URL: <+stage.variables.generated_openapi_url>
                INVENTORY_BEARER_TOKEN: <+secrets.getValue("paypal_contract_demo_token")>
              command: |
                set -eu
                node "$BUNDLE_PATH/paypal-contract-gate.mjs" verify \
                  --config "$CONFIG_PATH" \
                  --clean
              reports:
                type: JUnit
                spec:
                  paths:
                    - .contract-reports/contract-gate-summary.xml
                    - .contract-reports/oas-audit.xml
                    - .contract-reports/oas-diff.xml
                    - .contract-reports/consumer-bdc.xml
                    - .contract-reports/route-contract.xml
                    - .contract-reports/generated-openapi-route-contract.xml
              resources:
                limits:
                  memory: 500Mi
                  cpu: "0.5"
        - step:
            type: Run
            name: Postman CLI lower-environment cases
            identifier: postman_cli_lower_cases
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
              shell: Sh
              envVariables:
                BUNDLE_PATH: <+stage.variables.bundle_path>
                APP_BASE_URL: <+stage.variables.app_base_url>
                POSTMAN_COLLECTION_PATH: <+stage.variables.postman_collection_path>
                POSTMAN_COLLECTION_ID: <+stage.variables.postman_collection_id>
                POSTMAN_API_KEY: <+secrets.getValue("paypal_postman_service_account_pmak")>
                CONTRACT_DEMO_TOKEN: <+secrets.getValue("paypal_contract_demo_token")>
              command: |
                set -eu
                export HOME="$PWD/.ci-home"
                mkdir -p "$HOME"
                npm install --global --prefix "$PWD/.postman-cli" postman-cli@1.45.0
                export PATH="$PWD/.postman-cli/bin:$PATH"
                COLLECTION="$POSTMAN_COLLECTION_ID"
                [ -n "$COLLECTION" ] || COLLECTION="$POSTMAN_COLLECTION_PATH"
                if [ -z "$COLLECTION" ]; then
                  echo "set postman_collection_path or postman_collection_id" >&2
                  exit 2
                fi
                set -- \
                  --collection "$COLLECTION" \
                  --base-url "$APP_BASE_URL" \
                  --out-dir .contract-reports/postman
                [ -z "$POSTMAN_COLLECTION_ID" ] || set -- "$@" --cloud
                node "$BUNDLE_PATH/scripts/postman/run-lower-collection.mjs" "$@"
              reports:
                type: JUnit
                spec:
                  paths:
                    - .contract-reports/postman/postman-run.xml
              resources:
                limits:
                  memory: 500Mi
                  cpu: "0.5"
        - step:
            type: Run
            name: Seal all JSON and JUnit evidence
            identifier: seal_all_evidence
            spec:
              connectorRef: <+input>
              image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
              shell: Sh
              command: |
                set -eu
                cp .contract-inputs/vendored-bundle-attestation.json \
                  .contract-reports/bundle-attestation.json
                node --input-type=module <<'NODE'
                import { createHash } from 'node:crypto';
                import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
                const files = readdirSync('.contract-reports', { recursive: true })
                  .map(String)
                  .filter((file) =>
                    file !== 'evidence-manifest.json' &&
                    (file.endsWith('.json') || file.endsWith('.xml') || file.endsWith('.txt')))
                  .sort();
                const evidence = files.map((file) => {
                  const content = readFileSync(`.contract-reports/${file}`);
                  return {
                    file,
                    bytes: content.length,
                    sha256: createHash('sha256').update(content).digest('hex'),
                  };
                });
                writeFileSync(
                  '.contract-reports/evidence-manifest.json',
                  `${JSON.stringify({ schemaVersion: 1, files: evidence }, null, 2)}\n`,
                );
                console.log(JSON.stringify({ evidenceManifest: evidence }, null, 2));
                NODE
              resources:
                limits:
                  memory: 500Mi
                  cpu: "0.25"
    infrastructure:
      type: KubernetesDirect
      spec:
        connectorRef: <+input>
        namespace: <+input>.default(paypal-contract-lower)
        automountServiceAccountToken: false
        nodeSelector: {}
        containerSecurityContext:
          runAsNonRoot: true
          runAsUser: "1000"
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        os: Linux
