# Lower-environment integration proof for the phase-1 Broker track.
#
# This deliberately does not deploy or record a deployment. PayPal's real service
# pipeline imports pact-can-i-deploy immediately before deployment and
# pact-record-deployment only after deployment + Postman smoke checks succeed.
# The committed pact used here is seeded integration evidence; production consumer
# repositories must publish pacts created by executable tests of their real clients.
# This complete proof imports from this repository only. Connectors, secrets, the
# Broker, and the two Postman workspaces remain customer-owned runtime dependencies.
pipeline:
  name: PayPal Postman and Pact Broker proof - lower
  identifier: paypal_postman_pact_broker_lower
  orgIdentifier: default
  projectIdentifier: default_project
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: paypal-pact-harness-cd
        build: <+input>
  variables:
    - name: CONTAINER_REGISTRY_CONNECTOR
      type: String
      value: <+input>
    - name: KUBERNETES_CONNECTOR
      type: String
      value: <+input>
    - name: KUBERNETES_NAMESPACE
      type: String
      value: <+input>.default(paypal-contract-lower)
    - name: BROKER_BASE_URL
      type: String
      value: <+input>
    - name: REVIEWED_SOURCE_COMMIT
      type: String
      value: <+input> # independently reviewed full SHA; must match the selected build ref
    - name: CONSUMER_PACT_BRANCH
      type: String
      value: <+input> # logical branch for branch, tag, PR, and manual executions
    - name: PROVIDER_PACT_BRANCH
      type: String
      value: <+input> # logical branch for branch, tag, PR, and manual executions
    - name: CONSUMER_WORKSPACE_ID
      type: String
      value: <+input>
    - name: CONSUMER_SPEC_ID
      type: String
      value: <+input>
    - name: CONSUMER_SPEC_CANONICAL_SHA256
      type: String
      value: <+input>
    - name: PROVIDER_WORKSPACE_ID
      type: String
      value: <+input>
    - name: PROVIDER_SPEC_ID
      type: String
      value: <+input>
    - name: PROVIDER_SPEC_CANONICAL_SHA256
      type: String
      value: <+input>
    - name: PROVIDER_COLLECTION_UID
      type: String
      value: <+input>
    - name: PROVIDER_COLLECTION_WORKSPACE_ID
      type: String
      value: <+input>
    - name: PROVIDER_COLLECTION_CANONICAL_SHA256
      type: String
      value: <+input>
    - name: INCLUDE_WIP_PACTS_SINCE
      type: String
      value: <+input>
    - name: TARGET_ENVIRONMENT
      type: String
      value: <+input>.default(lower)
  stages:
    - stage:
        name: Consumer first Broker
        identifier: postman_pact_broker_proof
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          execution:
            steps:
              - step:
                  type: Run
                  name: Attest Postman-CS source and portable CLI
                  identifier: source_attestation
                  spec:
                    connectorRef: <+pipeline.variables.CONTAINER_REGISTRY_CONNECTOR>
                    image: node:24@sha256:19cd848a0e073d34bd8cd5545a1b6b4d28489b3e3b607366621ced442bd5f6b4
                    shell: Sh
                    envVariables:
                      EXPECTED_SOURCE_COMMIT: <+pipeline.variables.REVIEWED_SOURCE_COMMIT>
                      SOURCE_REPOSITORY_URL: <+codebase.repoUrl>
                    command: |
                      set -eu
                      node scripts/ci/attest-harness-source.mjs \
                        --expected-commit "$EXPECTED_SOURCE_COMMIT"
                    resources:
                      limits:
                        memory: 500Mi
                        cpu: "0.25"
              - step:
                  type: Background
                  name: Orders provider under test
                  identifier: orders_provider_under_test
                  spec:
                    connectorRef: <+pipeline.variables.CONTAINER_REGISTRY_CONNECTOR>
                    image: maven:3.9.11-eclipse-temurin-21@sha256:6fdc855a6ed81d288ca7ca37ac6ff5e9308b612485c0801d70b25a858c83d237
                    shell: Sh
                    envVariables:
                      CONTRACT_DEMO_TOKEN: <+secrets.getValue("paypal_contract_demo_token")>
                    command: |
                      set -eu
                      WORKSPACE="$PWD"
                      mkdir -p "$WORKSPACE/.m2/repository" "$WORKSPACE/.maven-home"
                      export MAVEN_OPTS="-Duser.home=$WORKSPACE/.maven-home"
                      cd demo/orders-spring
                      mvn -B \
                        -Dmaven.repo.local="$WORKSPACE/.m2/repository" \
                        -DskipTests package
                      exec java -jar target/orders-spring-wrapper-0.1.0.jar
                    resources:
                      limits:
                        memory: 640Mi
                        cpu: "0.5"
              - step:
                  type: Run
                  name: Postman dual-OAS and static BDC preflight
                  identifier: postman_static_preflight
                  spec:
                    connectorRef: <+pipeline.variables.CONTAINER_REGISTRY_CONNECTOR>
                    image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
                    shell: Sh
                    envVariables:
                      POSTMAN_API_KEY: <+secrets.getValue("paypal_postman_service_account_pmak")>
                    command: |
                      set -eu
                      INPUTS=.contract-inputs/postman
                      REPORTS=.contract-reports/postman-oas
                      mkdir -p "$INPUTS" "$REPORTS"
                      node tools/pact-harness/scripts/postman/pull-workspace-oas.mjs \
                        --consumer-workspace-id "<+pipeline.variables.CONSUMER_WORKSPACE_ID>" \
                        --consumer-spec-id "<+pipeline.variables.CONSUMER_SPEC_ID>" \
                        --consumer-expected-canonical-sha256 "<+pipeline.variables.CONSUMER_SPEC_CANONICAL_SHA256>" \
                        --provider-workspace-id "<+pipeline.variables.PROVIDER_WORKSPACE_ID>" \
                        --provider-spec-id "<+pipeline.variables.PROVIDER_SPEC_ID>" \
                        --provider-expected-canonical-sha256 "<+pipeline.variables.PROVIDER_SPEC_CANONICAL_SHA256>" \
                        --out-dir "$INPUTS"
                      unset POSTMAN_API_KEY
                      cp "$INPUTS/postman-oas-provenance.json" \
                        "$REPORTS/postman-oas-provenance.json"
                      node tools/pact-harness/pact-harness.mjs oas-to-pact \
                        --oas "$INPUTS/consumer-oas.yaml" \
                        --provider paypal-orders \
                        --consumer orders-checkout-consumer \
                        --out "$INPUTS/consumer-oas.pact.json"
                      node tools/pact-harness/pact-harness.mjs bdc-verify \
                        --oas "$INPUTS/provider-oas.yaml" \
                        --pact "$INPUTS/consumer-oas.pact.json" \
                        --policy config/contract-policy.json \
                        --junit "$REPORTS/postman-oas-bdc.xml" \
                        --json-out "$REPORTS/postman-oas-bdc.json"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - .contract-reports/postman-oas/postman-oas-bdc.xml
                    resources:
                      limits:
                        memory: 500Mi
                        cpu: "0.5"
              - step:
                  type: Run
                  name: Existing Postman and provider-conformance gate
                  identifier: existing_postman_provider_gate
                  spec:
                    connectorRef: <+pipeline.variables.CONTAINER_REGISTRY_CONNECTOR>
                    image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
                    shell: Sh
                    envVariables:
                      PAYPAL_CONTRACT_ACTUATOR_URL: http://127.0.0.1:8080/actuator/mappings
                      PAYPAL_CONTRACT_OPENAPI_URL: http://127.0.0.1:8080/v3/api-docs
                      PAYPAL_CONTRACT_INVENTORY_ATTEMPTS: "60"
                      INVENTORY_BEARER_TOKEN: <+secrets.getValue("paypal_contract_demo_token")>
                    command: |
                      set -eu
                      node paypal-contract-gate.mjs verify \
                        --config paypal-contract-gate.config.json
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - .contract-reports/contract-gate-summary.xml
                          - .contract-reports/oas-audit.xml
                          - .contract-reports/oas-diff.xml
                          - .contract-reports/consumer-bdc.xml
                          - .contract-reports/route-contract.xml
                          - .contract-reports/generated-openapi-route-contract.xml
                    resources:
                      limits:
                        memory: 500Mi
                        cpu: "0.5"
              - step:
                  type: Run
                  name: Approved Postman provider Collection against lower
                  identifier: postman_provider_collection
                  spec:
                    connectorRef: <+pipeline.variables.CONTAINER_REGISTRY_CONNECTOR>
                    image: node:24-bookworm-slim@sha256:235600a8101ab264e117b1768e925532262668dc9b581ef1dd7d96ced463b8e7
                    shell: Sh
                    envVariables:
                      POSTMAN_API_KEY: <+secrets.getValue("paypal_postman_service_account_pmak")>
                      CONTRACT_DEMO_TOKEN: <+secrets.getValue("paypal_contract_demo_token")>
                    command: |
                      set -eu
                      export HOME="$PWD/.ci-home"
                      mkdir -p "$HOME"
                      npm install --global --prefix "$PWD/.postman-cli" postman-cli@1.45.0
                      export PATH="$PWD/.postman-cli/bin:$PATH"
                      node tools/pact-harness/scripts/postman/run-lower-collection.mjs \
                        --collection "<+pipeline.variables.PROVIDER_COLLECTION_UID>" \
                        --base-url http://127.0.0.1:8080 \
                        --out-dir .contract-reports/postman \
                        --cloud \
                        --workspace-id "<+pipeline.variables.PROVIDER_COLLECTION_WORKSPACE_ID>" \
                        --expected-sha256 "<+pipeline.variables.PROVIDER_COLLECTION_CANONICAL_SHA256>"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - .contract-reports/postman/postman-run.xml
                    resources:
                      limits:
                        memory: 500Mi
                        cpu: "0.5"
              - step:
                  type: Run
                  name: Publish seeded lower consumer pact
                  identifier: publish_seeded_consumer_pact
                  spec:
                    connectorRef: <+pipeline.variables.CONTAINER_REGISTRY_CONNECTOR>
                    image: node:24@sha256:19cd848a0e073d34bd8cd5545a1b6b4d28489b3e3b607366621ced442bd5f6b4
                    shell: Sh
                    envVariables:
                      PACT_BROKER_BASE_URL: <+pipeline.variables.BROKER_BASE_URL>
                      PACT_BROKER_USERNAME: pact
                      PACT_BROKER_PASSWORD: <+secrets.getValue("paypal_pact_broker_password")>
                      PACT_DO_NOT_TRACK: "true"
                      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
                      CONSUMER_APP_VERSION: <+pipeline.variables.REVIEWED_SOURCE_COMMIT>
                      CONSUMER_PACT_BRANCH: <+pipeline.variables.CONSUMER_PACT_BRANCH>
                    command: |
                      set -eu
                      mkdir -p .pact/bin .pacts .contract-reports/pact-consumer
                      cp fixtures/paypal/orders-consumer.pact.json .pacts/
                      test -r "$SSL_CERT_FILE"
                      node scripts/ci/pact-broker-preflight.mjs
                      node tools/pact-harness/scripts/install-pact-cli.mjs \
                        --lock tools/pact-harness/pact-cli.lock.json \
                        --output .pact/bin/pact
                      if ! .pact/bin/pact broker publish .pacts \
                          --consumer-app-version "$CONSUMER_APP_VERSION" \
                          --branch "$CONSUMER_PACT_BRANCH" \
                          --validate \
                          --strict \
                          --retries 3 \
                          --log-level error \
                          --output json \
                          > .contract-reports/pact-consumer/publish.json 2>&1; then
                        node -e 'const fs=require("node:fs");let text=fs.readFileSync(process.argv[1],"utf8");for(const name of ["PACT_BROKER_PASSWORD"]){const secret=process.env[name];if(secret)text=text.split(secret).join("[REDACTED]")}process.stderr.write(text)' \
                          .contract-reports/pact-consumer/publish.json
                        exit 1
                      fi
                      cat .contract-reports/pact-consumer/publish.json
                    resources:
                      limits:
                        memory: 500Mi
                        cpu: "0.5"
              - step:
                  type: Run
                  name: Official provider verification and publication
                  identifier: official_provider_verification
                  spec:
                    connectorRef: <+pipeline.variables.CONTAINER_REGISTRY_CONNECTOR>
                    image: node:24@sha256:19cd848a0e073d34bd8cd5545a1b6b4d28489b3e3b607366621ced442bd5f6b4
                    shell: Sh
                    envVariables:
                      PACT_BROKER_BASE_URL: <+pipeline.variables.BROKER_BASE_URL>
                      PACT_BROKER_USERNAME: pact
                      PACT_BROKER_PASSWORD: <+secrets.getValue("paypal_pact_broker_password")>
                      PACT_DO_NOT_TRACK: "true"
                      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
                      PROVIDER_BEARER_TOKEN: <+secrets.getValue("paypal_contract_demo_token")>
                      PROVIDER_VERSION: <+pipeline.variables.REVIEWED_SOURCE_COMMIT>
                      PROVIDER_PACT_BRANCH: <+pipeline.variables.PROVIDER_PACT_BRANCH>
                    command: |
                      set -eu
                      REPORTS=.contract-reports/pact-provider
                      mkdir -p "$REPORTS"
                      rm -f "$REPORTS/provider-verification.xml" \
                        "$REPORTS/provider-verification.json"
                      test -r "$SSL_CERT_FILE"
                      node scripts/ci/pact-broker-preflight.mjs
                      node tools/pact-harness/scripts/install-pact-cli.mjs \
                        --lock tools/pact-harness/pact-cli.lock.json \
                        --output .pact/bin/pact
                      .pact/bin/pact verifier \
                        --broker-url "$PACT_BROKER_BASE_URL" \
                        --provider-name paypal-orders \
                        --hostname 127.0.0.1 \
                        --port 8080 \
                        --transport http \
                        --header "Authorization=Bearer $PROVIDER_BEARER_TOKEN" \
                        --state-change-url http://127.0.0.1:8080/_pact/provider-states \
                        --consumer-version-selectors '[{"mainBranch":true},{"deployedOrReleased":true},{"matchingBranch":true}]' \
                        --enable-pending \
                        --include-wip-pacts-since "<+pipeline.variables.INCLUDE_WIP_PACTS_SINCE>" \
                        --provider-version "$PROVIDER_VERSION" \
                        --provider-branch "$PROVIDER_PACT_BRANCH" \
                        --publish \
                        --retries 3 \
                        --junit "$REPORTS/provider-verification.xml" \
                        --json "$REPORTS/provider-verification.json" \
                        --no-colour
                      node scripts/ci/assert-pact-evidence.mjs provider-verification \
                        --junit "$REPORTS/provider-verification.xml"
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - .contract-reports/pact-provider/provider-verification.xml
                    resources:
                      limits:
                        memory: 500Mi
                        cpu: "0.5"
              - step:
                  type: Run
                  name: Broker can-i-deploy lower gate
                  identifier: broker_can_i_deploy_lower
                  spec:
                    connectorRef: <+pipeline.variables.CONTAINER_REGISTRY_CONNECTOR>
                    image: node:24@sha256:19cd848a0e073d34bd8cd5545a1b6b4d28489b3e3b607366621ced442bd5f6b4
                    shell: Sh
                    envVariables:
                      PACT_BROKER_BASE_URL: <+pipeline.variables.BROKER_BASE_URL>
                      PACT_BROKER_USERNAME: pact
                      PACT_BROKER_PASSWORD: <+secrets.getValue("paypal_pact_broker_password")>
                      PACT_DO_NOT_TRACK: "true"
                      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
                      CONSUMER_APP_VERSION: <+pipeline.variables.REVIEWED_SOURCE_COMMIT>
                      PROVIDER_VERSION: <+pipeline.variables.REVIEWED_SOURCE_COMMIT>
                    command: |
                      set -eu
                      REPORTS=.contract-reports/pact-deploy
                      mkdir -p "$REPORTS"
                      rm -f "$REPORTS/can-i-deploy.json" \
                        "$REPORTS/can-i-deploy.stderr.txt"
                      test -r "$SSL_CERT_FILE"
                      node scripts/ci/pact-broker-preflight.mjs
                      node tools/pact-harness/scripts/install-pact-cli.mjs \
                        --lock tools/pact-harness/pact-cli.lock.json \
                        --output .pact/bin/pact
                      set +e
                      .pact/bin/pact broker can-i-deploy \
                        --pacticipant orders-checkout-consumer \
                        --version "$CONSUMER_APP_VERSION" \
                        --pacticipant paypal-orders \
                        --version "$PROVIDER_VERSION" \
                        --to-environment "<+pipeline.variables.TARGET_ENVIRONMENT>" \
                        --retries 3 \
                        --retry-while-unknown 6 \
                        --retry-interval 10 \
                        --output json \
                        > "$REPORTS/can-i-deploy.json" \
                        2> "$REPORTS/can-i-deploy.stderr.txt"
                      status=$?
                      set -e
                      cat "$REPORTS/can-i-deploy.stderr.txt" >&2
                      cat "$REPORTS/can-i-deploy.json"
                      node scripts/ci/assert-pact-evidence.mjs can-i-deploy \
                        --json "$REPORTS/can-i-deploy.json"
                      [ "$status" -eq 0 ]
                    resources:
                      limits:
                        memory: 500Mi
                        cpu: "0.25"
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: <+pipeline.variables.KUBERNETES_CONNECTOR>
              namespace: <+pipeline.variables.KUBERNETES_NAMESPACE>
              automountServiceAccountToken: false
              nodeSelector: {}
              containerSecurityContext:
                runAsNonRoot: true
                runAsUser: "1000"
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              os: Linux
