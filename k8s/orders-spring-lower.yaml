apiVersion: v1
kind: Namespace
metadata:
  name: paypal-contract-lower
  labels:
    kubernetes.io/metadata.name: paypal-contract-lower
    app.kubernetes.io/part-of: paypal-contract-demo
    paypal.com/environment: lower
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-spring
  namespace: paypal-contract-lower
  labels:
    app.kubernetes.io/name: orders-spring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-spring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-spring
        paypal.com/environment: lower
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: postman-cs-ghcr
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: orders-spring
          image: ghcr.io/postman-cs/paypal-pact-harness-cd/orders-spring-wrapper@sha256:a1dd972b452c326a26941cde0916a607f7aa60104f14d6898ab38ef779d7376c
          imagePullPolicy: Always
          env:
            - name: CONTRACT_DEMO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orders-spring-contract-auth
                  key: token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: orders-spring
  namespace: paypal-contract-lower
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-spring
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# The application is intentionally private. Harness CI pods in the same lower
# namespace may call it; ingress from other namespaces and all app egress are denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-spring-private
  namespace: paypal-contract-lower
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-spring
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: paypal-contract-lower
      ports:
        - protocol: TCP
          port: 8080
  egress: []
